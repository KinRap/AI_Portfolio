<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page not found · Kinga Rapacka</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Sora:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.nf{min-height:100vh;display:grid;place-items:center;text-align:center;
  background:radial-gradient(1000px 620px at 60% -10%,#124A4A 0%,var(--void) 58%);color:var(--paper);padding:40px}
.nf-code{font-family:var(--font-display);font-weight:800;font-size:clamp(4rem,16vw,9rem);line-height:1;
  background:linear-gradient(92deg,var(--ultra),var(--magenta) 60%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.nf-kick{font-family:var(--font-mono);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);margin-bottom:18px}
.nf h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,3vw,1.9rem);margin:14px 0 12px}
.nf p{color:rgba(240,243,242,.72);max-width:440px;margin:0 auto 28px}
.nf-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="nf">
  <div>
    <div class="nf-kick">Error · pipeline halted</div>
    <div class="nf-code">404</div>
    <h1>This route returned NO_DATA.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to something that runs.</p>
    <div class="nf-row">
      <a class="btn btn-primary" href="index.html">← Back home</a>
      <a class="btn btn-ghost" href="index.html#projects">See the projects</a>
    </div>
  </div>
</div>
</body>
</html>
